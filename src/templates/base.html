<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo Agrícola</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f2; }
        nav { background: #2e7d32; padding: 12px 24px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        main { max-width: 800px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #c8e6c9; }
        .ok { background: #c8e6c9; padding: 8px; margin-bottom: 8px; }
        .error { background: #ffcdd2; padding: 8px; margin-bottom: 8px; }
        input { display: block; margin-bottom: 12px; padding: 6px; width: 100%; }
        button, .boton { background: #2e7d32; color: white; border: none;
            padding: 8px 14px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('parcelas.listar') }}">Parcelas</a>
        
    </nav>
    <main>
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="{{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
